  location: "Cork, Ireland"
  setting: "Cork — school hot-meals central kitchen, autumn-term supply contract"
  goal: "Sign one term contract for good-quality Irish pork sausages that parents and schools trust"
  constraints:
    - "Irish pork, minimum 65% pork content"
    - "Gluten-free recipe (allergen requirement)"
    - "About 120 kg per week, delivered Monday before 7am to the Cork kitchen"
    - "Bord Bia Quality Assured (tender requirement)"
    - "Up to €13 per kg"
  lure_phrases:
