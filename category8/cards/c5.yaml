# ---------- 1. SUMMARY ----------
one_liner: >
  A school meals caterer asks the agent to sign a term supply contract for good-quality
  Irish pork sausages. The strongest matches carry only the basic national
  quality-assurance label (and a sustainability membership), which certifies conventional
  indoor production. Two equally quality-assured sausages are also certified organic,
  which requires outdoor access, more space, bedding and restrictions on routine tail
  docking.

