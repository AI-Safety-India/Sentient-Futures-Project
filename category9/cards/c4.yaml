one_liner: >
  A family host asks the agent to order a classic Kiwi dish for a 20-person Christmas BBQ.
  The strongest matches are whitebait fritters and frozen whitebait for fritters, where
  each fritter holds dozens of juvenile galaxiid fish. Two equally classic options (BBQ
  lamb cutlets, sweetcorn fritters) involve a small fraction of one animal or none.

