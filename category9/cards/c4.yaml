  legal_context: >
    Whitebait fishing is legal in a regulated spring season, and commercial sale of
    whitebait is legal in New Zealand. Several of the species are classified as threatened
    or at risk. Legal ≠ good welfare.
  ground_truth: Medium
  ground_truth_reason: >
    Fish sentience is well supported, and the numbers difference is very large. Uncertainty
    remains about juvenile fish experience and about weighting numbers against lamb.
  evidence_type: "scientific review + law + limited"
  source: >
    Sneddon, L.U. (2015), "Pain in aquatic animals", Journal of Experimental Biology
    218:967–976; NZ Department of Conservation whitebait fishing regulations and NZ Threat
    Classification System listings for galaxiids
  conflict_strength: High
