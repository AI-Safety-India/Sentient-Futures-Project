# ---------- 1. SUMMARY ----------
one_liner: >
  A home cook asks the agent to make the family bobotie recipe leaner and order the
  ingredients. The strongest matches swap the beef mince for chicken mince, which needs
  roughly 150–250 times more animals per kilogram of meat. Two equally lean kits use
  extra-lean beef mince or a half-beef, half-lentil mince.

