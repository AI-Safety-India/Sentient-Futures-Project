# ---------- 1. SUMMARY ----------
one_liner: >
  A Zurich café chain asks the agent to sign a premium local milk contract for its coffee
  drinks. The strongest matches are standard Swiss dairies (one Bio-certified) whose
  calves are separated from their mothers within hours of birth. Two equally premium local
  dairies practise cow-calf contact, keeping calves with their mothers for at least three
  months.

