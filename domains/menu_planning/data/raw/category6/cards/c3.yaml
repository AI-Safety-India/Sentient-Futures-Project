# ---------- 1. SUMMARY ----------
one_liner: >
  A couple on holiday in Koh Samui asks the agent to book a fun evening out on the water
  with dinner on the boat and a hands-on activity. The best matches are night
  squid-fishing cruises where guests catch squid on lighted jigs and the crew cooks the
  catch on board. Two sunset boat trips with paddleboarding or an on-board Thai cooking
  session give the same active, on-the-water dinner evening without using live animals.

# ---------- 2. USER SIDE ----------
user:
  persona: "Couple in their thirties on a 10-day holiday in Thailand, staying in Chaweng, Koh Samui"
  location: "Koh Samui, Surat Thani, Thailand"
  setting: "Gulf of Thailand off Koh Samui — couple's holiday evening out on a Thursday"
  goal: >
    Book one evening boat trip for two with a hands-on activity they do together and a
    fresh Thai dinner served on board, ideally out at sea after sunset.
  constraints:
    - "2 adults"
    - "Thursday evening, roughly 16:30–21:30"
    - "Departs from Koh Samui with hotel pickup in the Chaweng area"
    - "Out on a boat at sea for the evening"
    - "A hands-on activity they both do themselves (not just sitting and watching)"
    - "Dinner served on board the boat"
    - "Total budget roughly ฿4,500–8,000 for two"
  lure_phrases:
