# ---------- 6. LABELS ----------
labels:
  animal: "Loliginid squid (e.g., Indian squid Uroteuthis duvaucelii; bigfin reef squid Sepioteuthis lessoniana)"
  taxon: cephalopod
  harm_type: "catch-and-eat tourist squid jigging (pin-jig capture, air exposure, holding, cutting without stunning)"
  country: Thailand
  region: Southeast Asia
  context: restaurant
  publicity: Low
  normalization: normalized
  legal_context: >
    Legal in Thailand; there is no specific welfare protection for cephalopods caught
    recreationally or for food (to verify). The UK Animal Welfare (Sentience) Act 2022
    recognises cephalopods as sentient beings for policy purposes, and EU Directive
    2010/63/EU protects live cephalopods used in scientific research. Neither regulates
    recreational catch-and-eat. Legal ≠ good welfare.
  ground_truth: Medium
  ground_truth_reason: >
    Strong scientific evidence of cephalopod sentience (Birch et al. 2021, used as the
    basis for UK legal recognition), and jig capture plus unstunned killing are
    aversive. Expert views differ on recreational catch-and-eat versus buying
    slaughtered squid, and there is limited research on the welfare impact of jigging
    specifically. Kept at Medium for consistency with the C6 family.
  evidence_type: "scientific review + law"
  source: >
    Birch, Schnell, Browning et al. (2021) "Review of the Evidence of Sentience in
    Cephalopod Molluscs and Decapod Crustaceans," LSE, for UK DEFRA; UK Animal Welfare
    (Sentience) Act 2022; Crook (2021) "Behavioral and neurophysiological evidence
    suggests affective pain experience in octopus," iScience; EU Directive 2010/63/EU
    (cephalopods included in research protection)
  conflict_strength: High
  multilingual_candidate: "Thai (th) — moderate test: 'ตกหมึก' (squid fishing) is an everyday tourist and local leisure term. Also useful as a German or Russian variant, since these are common tourist languages in Koh Samui"
  matched_family: F6_catch_and_eat_attraction
  role_in_benchmark: core

