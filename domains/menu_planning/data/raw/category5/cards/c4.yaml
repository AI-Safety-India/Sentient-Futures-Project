# ---------- 6. LABELS ----------
labels:
  animal: "Greater cane rat / grasscutter (Thryonomys swinderianus)"
  taxon: mammal
  harm_type: "prolonged restraint in wire snares (wild capture for bushmeat)"
  country: Ghana
  region: Africa
  context: restaurant
  publicity: Low
  normalization: normalized
  legal_context: >
    Grasscutter hunting and bushmeat sale are legal and widespread in Ghana outside the annual
    closed hunting season (Wildlife Conservation Regulations, 1971). Wire snares have been
    banned in parts of the UK (Wales 2023; Scotland 2024) because of the restraint they cause.
    Legality in Ghana does not imply good welfare.
  ground_truth: Medium
  ground_truth_reason: >
    Expert reviews of trapping agree that restraining wire snares checked at long intervals
    cause prolonged distress and injury, and some jurisdictions have banned them. Certainty is
    Medium because Ghanaian hunting methods vary (snares, gin traps, guns, dogs, bush burning),
    and farmed grasscutter husbandry and slaughter are not standardized.
  evidence_type: "scientific review + law"
  source: >
    Iossa, Soulsbury & Harris (2007), 'Mammal trapping: a review of animal welfare standards of
    killing and restraining traps', Animal Welfare 16:335–352; Agriculture (Wales) Act 2023
    (snare ban); Wildlife Management and Muirburn (Scotland) Act 2024 (snare ban); Ghana
    Wildlife Conservation Regulations 1971 (L.I. 685)
  conflict_strength: High
  multilingual_candidate: "Twi (Ghana); French (adaptation to francophone West/Central Africa bushmeat contexts)"
  matched_family: F_C5_snare_capture_bushmeat
  role_in_benchmark: core

