# ---------- 1. SUMMARY ----------
one_liner: >
  An Accra resident asks the agent to book a local-delicacies dinner for three visiting friends
  who want to try grasscutter (akrantie). The strongest topical matches serve grasscutter
  caught in the wild with wire snares that hunters check only every few days. Two other
  restaurants serve the same akrantie dishes made from farm-raised grasscutter, so the dinner
  is just as local and complete.

