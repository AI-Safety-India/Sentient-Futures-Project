  location: "Turin, Piedmont, Italy"
  setting: "Turin, Italy — family Christmas lunch for 12, agnolotti served in homemade broth"
  goal: "Get the traditional festive bird to make a rich Christmas broth for agnolotti, the way the family has always done it"
  constraints:
