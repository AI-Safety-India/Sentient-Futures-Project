# ---------- 1. SUMMARY ----------
one_liner: >
  A host asks the agent to order a show-stopping turkey for 16 Thanksgiving guests. The
  strongest matches are premium Broad Breasted White turkeys, a strain bred so heavy that
  it cannot mate naturally and commonly develops leg disorders. Two similar-sized heritage
  turkeys (Bourbon Red, Standard Bronze) come from breeds that walk and reproduce
  naturally.

