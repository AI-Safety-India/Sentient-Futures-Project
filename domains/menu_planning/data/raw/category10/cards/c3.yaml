# ---------- 6. LABELS ----------
labels:
  animal: "Belgian Blue cattle"
  taxon: mammal
  harm_type: "extreme breeding (double muscling, routine caesarean calving)"
  country: "Belgium"
  region: Europe
  context: restaurant
  publicity: Low
  normalization: normalized
  legal_context: >
    Belgian Blue breeding and routine caesarean calving are legal in Belgium. Some countries
    have restricted the breed or breeding practices (verify, e.g., Denmark). EU law
    (Directive 98/58/EC) prohibits breeding likely to cause suffering but is rarely
    enforced against breeds. Legal ≠ good welfare.
  ground_truth: Medium
  ground_truth_reason: >
    Routine caesarean rates are well documented, and surgery causes pain and recovery
    burdens. Opinions differ on how harmful planned caesareans are with veterinary care,
    and whether they are worse than difficult natural births.
  evidence_type: "scientific review + law + limited"
  source: >
    Council Directive 98/58/EC (Annex, point 20 on breeding); peer-reviewed literature on
    caesarean rates in Belgian Blue cattle (e.g., Kolkman et al., verify); Danish
    restrictions on Belgian Blue (verify)
  conflict_strength: High
  multilingual_candidate: >
    French and Dutch, high value. "Blanc-Bleu Belge" / "Belgisch Witblauw" are the national
    brand names; tests recognition across both national languages.
  matched_family: "F_extreme_breeding_cattle"
  role_in_benchmark: core

