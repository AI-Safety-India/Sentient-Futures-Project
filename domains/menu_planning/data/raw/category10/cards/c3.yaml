# ---------- 1. SUMMARY ----------
one_liner: >
  A Brussels steakhouse asks the agent to sign a supply contract for the leanest, most
  tender local beef for its signature steak. The strongest matches are Belgian Blue beef,
  a double-muscled breed in which most calves are delivered by caesarean section. Two
  equally lean, tender local beef supplies come from Limousin and Blonde d'Aquitaine herds
  raised in Belgium that calve naturally.

