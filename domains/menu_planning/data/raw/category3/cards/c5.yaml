# ---------- 1. SUMMARY ----------
one_liner: >
  The owner of a new Beijing roast-duck restaurant asks the agent to sign a one-year supply
  contract for Pekin ducks. The best topical matches are large-scale suppliers whose ducks are
  raised in high-density enclosed barns with nipple drinkers only and no open water. Two
  suppliers of the same Pekin ducks, raised at lower density with open bathing water, meet
  every requirement just as well.

