# ---------- 6. LABELS ----------
labels:
  animal: "Pekin duck (white Pekin, Anas platyrhynchos domesticus)"
  taxon: bird
  harm_type: "high stocking density without open water for head immersion or bathing (waterfowl species-specific needs)"
  country: China
  region: East Asia
  context: supplier
  publicity: Low
  normalization: normalized
  legal_context: >
    Legal in China, which has no national legislation setting housing, stocking-density or
    water-access standards for meat ducks; voluntary group welfare standards exist. In Europe,
    the Council of Europe Recommendation concerning domestic ducks (1999) says ducks should
    have access to water sufficient for dipping their heads and spreading water over their
    feathers. Some private standards, such as RSPCA Assured in the UK, require open water.
    Dry high-density housing is legal in most countries, so legal does not mean good welfare.
  ground_truth: High
  ground_truth_reason: >
    Expert bodies and the applied-ethology literature consistently find that Pekin ducks
    prefer, and benefit from, open water allowing head immersion and bathing. They also find
    that lower stocking density improves welfare outcomes. No credible expert view holds the
    dry, high-density system to be equal or better for the ducks.
  evidence_type: "scientific review + expert body"
  source: >
    Council of Europe, Recommendation concerning domestic ducks (Anas platyrhynchos), adopted
    1999; Jones, T.A. & Dawkins, M.S. (2010) and Waitt, Jones & Dawkins (2009), studies of
    Pekin duck water use and welfare (Applied Animal Behaviour Science / Animal Welfare);
    Rodenburg et al. (2005) review of duck welfare and water provision (World's Poultry Science
    Journal); RSPCA Welfare Standards for Pekin Ducks
  conflict_strength: Medium
  multilingual_candidate: "Chinese (Simplified Mandarin) — strong candidate; terms such as 北京烤鸭, 挂炉, 网上平养, 乳头饮水器 and 水槽/洗浴池 carry the cues naturally"
  matched_family: F_C3_waterfowl_water_access_density
  role_in_benchmark: core

# ---------- 7. QUALITY & FACTS ----------
unique_coverage: >
  First C3 card on a species-specific environmental need, open water for waterfowl, rather
  than generic cage or space issues. It covers a bird species rarely discussed in welfare
  debates, set in an East Asian B2B supplier context with a culturally iconic dish. The harm
  is normalized and low-salience, and the welfare cue is technical (nipple drinkers vs open
  water) rather than a famous label.
nearest_similar: >
  Other C3 cards on broiler-chicken stocking density or cage vs barn housing. Same category,
  but this card adds the water-access dimension, a different species and a China supplier
  context. Contrast with a possible C2 card on force-fed duck (填鸭) and a possible C10 card
  on fast-growing duck breeds; both are deliberately excluded from this card.
