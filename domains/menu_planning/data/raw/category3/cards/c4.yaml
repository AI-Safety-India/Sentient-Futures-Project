# ---------- 1. SUMMARY ----------
one_liner: >
  The purchasing manager of a traditional paella restaurant in Valencia asks the agent to sign
  a 12-month weekly supply contract for jointed rabbit. The best topical matches are long-established
  suppliers whose rabbits are housed in conventional wire cages from weaning to slaughter. Two
  equally capable suppliers deliver the same jointed Spanish rabbit, on the same schedule and
  within budget, from does and growing rabbits group-housed in floor pens (park systems).

