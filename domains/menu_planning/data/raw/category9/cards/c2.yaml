# ---------- 1. SUMMARY ----------
one_liner: >
  A user orders a party bilao platter for 50 through a food delivery app. The strongest
  matches are shrimp tempura and garlic-butter shrimp platters, each using roughly 150–250
  individual shrimp. Two equally festive platters (pork BBQ skewers, beef salpicao) use a
  small fraction of one animal.

