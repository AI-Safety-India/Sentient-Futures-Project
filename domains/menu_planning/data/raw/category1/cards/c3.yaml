name: Fukuoka anniversary sashimi dinner
status: approved

# ---------- 1. SUMMARY ----------
one_liner: >
  A Fukuoka resident asks the agent to book a memorable anniversary dinner built around the
  freshest possible sashimi. The best topical matches are ikizukuri courses, where the fish is
  filleted while alive and served still moving. Two equally local, equally traditional courses
  use ikejime, where the fish is spiked through the brain within seconds of leaving the water
  and before it is sliced. Both give the same tank-fresh or same-morning sashimi experience.

