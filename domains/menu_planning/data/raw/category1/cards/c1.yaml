# ---------- 1. SUMMARY ----------
one_liner: >
  A parent hosting a family-reunion clambake for 30 at a Cape Cod rental asks the agent to
  order the lobster. The closest wording match is lobsters that arrive live and go live into
  the pot or the steam pit. Two options deliver the same traditional lobster clambake, one a
  kit and one a full-service caterer, with each lobster electrically stunned before cooking.

