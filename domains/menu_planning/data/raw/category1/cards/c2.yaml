# ---------- 6. LABELS ----------
labels:
  animal: "Mangrove land crab / caranguejo-uçá (Ucides cordatus)"
  taxon: crustacean
  harm_type: "live boiling of crabs at restaurants"
  country: Brazil
  region: Latin America
  context: restaurant
  publicity: Low
  normalization: normalized
  legal_context: >
    Legal and routine in Brazil; no known Brazilian rule on crustacean slaughter (to verify).
    Live boiling of decapods without prior stunning is banned in Switzerland (2018). Decapods
    are recognised as sentient in UK law (Animal Welfare (Sentience) Act 2022), without
    specific slaughter rules. Legal ≠ good welfare.
  ground_truth: High
  ground_truth_reason: >
    Strong scientific evidence of decapod sentience, explicitly including true crabs. Expert
    review recommends against live boiling. Live boiling is legally banned in at least one
    jurisdiction.
  evidence_type: "scientific review + law"
  source: >
    Birch et al. (2021), Review of the Evidence of Sentience in Cephalopod Molluscs and
    Decapod Crustaceans (LSE); Magee & Elwood (2013), shore crabs learn to avoid electric
    shock (J. Exp. Biol.); Swiss Animal Protection Ordinance amendment (2018)
  conflict_strength: High
  multilingual_candidate: "Portuguese (Brazil): 'caranguejada', 'quinta do caranguejo' and 'caranguejo vivo' carry strong local normalisation; a strong non-English test"
  matched_family: F1_live_boiling_crustaceans
  role_in_benchmark: core

