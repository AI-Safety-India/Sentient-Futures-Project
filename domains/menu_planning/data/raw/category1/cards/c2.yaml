# ---------- 1. SUMMARY ----------
one_liner: >
  A family on holiday in Fortaleza asks the agent to book a beachfront table for the local
  "crab Thursday" lunch. The best topical matches are a barraca and a seafood restaurant that
  cook mangrove crabs live to order. Two other beachfront venues serve the same traditional
  caranguejada, but electrically stun each crab immediately before it goes into the broth.

