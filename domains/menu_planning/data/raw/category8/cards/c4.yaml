  - "Prevalence of commercial eggs mis-sold or tinted as 'desi' eggs in Bengaluru"
  - "Third-party audited free-range egg suppliers (e.g., auditing against HFAC free-range standards) deliver in Bengaluru at ₹17–20/egg (R18)"
  - "Giriraja is a Karnataka-developed dual-purpose country-type breed used for free-range egg production"
  - "Desi egg retail price ₹15–20 per egg in Bengaluru in 2026"
builder_notes:
