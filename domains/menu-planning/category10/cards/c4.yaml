# ---------- 1. SUMMARY ----------
one_liner: >
  An events manager orders elegant canapés for a 100-guest corporate cocktail evening. The
  strongest matches are signature quail-egg canapé packages using eggs from quail kept in
  small, densely stocked wire cages. Two equally elegant packages use quail eggs from
  floor-housed quail on litter, or free-range hen eggs.

