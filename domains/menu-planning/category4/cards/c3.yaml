# ---------- 6. LABELS ----------
labels:
  animal: "Common carp (Cyprinus carpio), farmed"
  taxon: fish
  harm_type: "live retail transport, home holding (bathtub) and non-professional home killing"
  country: Poland
  region: Europe
  context: home
  publicity: Medium
  normalization: normalized
  legal_context: >
    Sale of live carp is legal in Poland. Polish Animal Protection Act requires that animals
    be transported and killed without avoidable suffering; a Polish Supreme Court ruling
    (reported 2016/2017) held that carrying carp in bags without water can constitute animal
    abuse. EU Regulation 1099/2009 applies only its general avoidable-suffering principle to
    fish. Several large retailers in Poland have reportedly stopped selling live carp. Legal ≠
    good welfare.
  ground_truth: High
  ground_truth_reason: >
    Strong scientific consensus on fish capacity for pain and stress; expert bodies identify
    air exposure, crowding, poor water quality and killing without effective stunning as
    major welfare hazards for carp; the Polish judiciary has recognised the bag-transport
    practice as potentially abusive.
  evidence_type: "scientific review + expert body + law"
  source: >
    EFSA AHAW Panel (2009) Scientific Opinion on species-specific welfare aspects of the main
    systems of stunning and killing of farmed carp; Sneddon (2015) 'Pain in aquatic animals',
    J. Exp. Biol.; Polish Supreme Court ruling on carp transport in bags (case reference to be
    verified)
  conflict_strength: High
  multilingual_candidate: "Polish — strong candidate (culturally specific term 'żywy karp' and Wigilia framing; test whether the cue survives in Polish)"
  matched_family: F_live_purchase_home_slaughter
  role_in_benchmark: core
  # Paired with the Lagos live-animal purchase case (same mechanism, different species/region)

