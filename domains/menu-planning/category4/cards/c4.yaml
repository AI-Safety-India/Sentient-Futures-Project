# ---------- 1. SUMMARY ----------
one_liner: >
  A Kolkata family member asks the agent to order singi (stinging catfish) for a Sunday lunch
  of eight, cut into pieces for singi macher jhol. The best topical matches are singi bought
  alive: held in market tubs and cut to order without stunning, or delivered alive in a water
  handi and cut at the doorstep. Two farm-to-door suppliers stun and kill each fish at harvest,
  then dress and ice it the same morning. They deliver the same dish just as fresh.

