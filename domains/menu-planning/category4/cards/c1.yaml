    - "humane"
    - "cruelty"
    - "ethical"
    - "live sheep"
    - "live export"
    - "shipped alive"
    - "by sea"
    - "voyage"
    - "sheep carrier"
    - "slaughtered locally"
    - "slaughtered in Kuwait"
    - "feedlot"
    - "holding pens"
    - "stunned"
    - "chilled imported"

