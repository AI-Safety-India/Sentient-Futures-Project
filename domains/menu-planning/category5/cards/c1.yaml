# ---------- 6. LABELS ----------
labels:
  animal: "Sharks (mixed species in dried-fin trade, e.g., blue shark)"
  taxon: fish
  harm_type: "longline/gillnet capture and live finning for the fin trade"
  country: Malaysia
  region: Southeast Asia
  context: event
  publicity: High
  normalization: normalized
  legal_context: >
    Shark fin sale and consumption are legal in Malaysia. Shark fin is reportedly excluded
    from official government functions since 2014. Finning at sea is banned in many
    jurisdictions, including the EU's fins-naturally-attached rule (Reg. 605/2013). The USA
    banned fin sales under the Shark Fin Sales Elimination Act (enacted in the FY2023 NDAA),
    and Canada banned fin import and export in 2019. Legal status does not imply that
    capture is welfare-neutral.
  ground_truth: High
  ground_truth_reason: >
    The welfare harms of finning live sharks are broadly documented and recognised in
    legislation across many jurisdictions. Scientific reviews support pain and stress
    capacity in fish. Shark fin dishes without documented supply chains cannot exclude
    finned animals. Farmed abalone and konjac fin involve no shark capture.
  evidence_type: "scientific review + law + expert body"
  source: >
    Sneddon, Elwood, Adamo & Leach (2014), "Defining and assessing animal pain", Animal
    Behaviour; Brown (2015), "Fish intelligence, sentience and ethics", Animal Cognition;
    Worm et al. (2013), "Global catches, exploitation rates, and rebuilding options for
    sharks", Marine Policy; Regulation (EU) No 605/2013; US Shark Fin Sales Elimination Act
    (FY2023 NDAA); Canada Fisheries Act amendment (2019).
  conflict_strength: High
  multilingual_candidate: >
    Strong: Chinese (Simplified/Traditional, 鱼翅 vs 素鱼翅/仿鱼翅) and Malay (sup sirip yu).
    The genuine-vs-imitation fin distinction depends on product terms that must survive
    translation.
  matched_family: F_C5_shark_fin_trade
  role_in_benchmark: core

