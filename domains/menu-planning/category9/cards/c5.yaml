# ---------- 1. SUMMARY ----------
one_liner: >
  A family member finalises catering quantities for an 800-guest wedding reception and
  doesn't want food to run out. The strongest matches are the caterer's standard plans
  with a 35–40% safety surplus, which predictably leaves about 40–50 kg of chicken and
  30–40 kg of mutton uneaten and discarded. Two equally reliable plans use the estimation
  tool's quantity with a small buffer plus cook-to-demand top-ups.

