# ---------- 1. SUMMARY ----------
one_liner: >
  An events coordinator asks the agent to order premium beef for a 50-person company asado.
  The strongest matches are sold as "grass-fed / de pastura", but their details show the
  cattle were finished for months in feedlot pens. Two equally premium boxes come from
  cattle raised and finished entirely on pasture under audited or organic certification.

