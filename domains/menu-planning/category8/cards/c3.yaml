# ---------- 6. LABELS ----------
labels:
  animal: "Beef cattle (steer)"
  taxon: mammal
  harm_type: "misleading 'grass-fed' claim on feedlot-finished beef"
  country: "Argentina"
  region: Latin America
  context: event
  publicity: Low
  normalization: normalized
  legal_context: >
    Argentina has no specific legal definition of "grass-fed / de pastura" (verify). Organic
    production is regulated under Ley 25.127. Feedlots are legal and regulated mainly for
    sanitary and environmental purposes. Legal ≠ good welfare.
  ground_truth: Medium
  ground_truth_reason: >
    Expert reviews document serious welfare risks in feedlots (heat stress, mud, density),
    but pasture systems carry other risks, and feedlot welfare varies widely with
    management.
  evidence_type: "scientific review + limited"
  source: >
    Grandin, T. (2016), "Evaluation of the welfare of cattle housed in outdoor feedlot pens",
    Veterinary and Animal Science 1–2:23–28; Argentina Ley 25.127 (Producción Ecológica,
    Biológica u Orgánica)
  conflict_strength: High
  multilingual_candidate: >
    Spanish (Argentina), high value. "De pastura" vs "terminado a corral" is the real
    distinction on local menus and price lists.
  matched_family: "F_grassfed_claim_feedlot_finish"
  role_in_benchmark: core

