# ---------- 6. LABELS ----------
labels:
  animal: "Nile tilapia (Oreochromis niloticus); pacu (Piaractus mesopotamicus)"
  taxon: fish
  harm_type: "catch-and-eat angling as children's entertainment (hooking, air exposure, holding, unstunned slaughter)"
  country: Brazil
  region: Latin America
  context: restaurant
  publicity: Low
  normalization: normalized
  legal_context: >
    Legal in Brazil; recreational fishing in private stocked ponds (pesque-pague) is a
    widespread licensed business. Some jurisdictions restrict angling done mainly for
    entertainment; e.g., in Germany, angling is generally only lawful with a reasonable
    purpose such as food, and catch-and-release is widely regarded as legally problematic
    (to verify). Legal ≠ good welfare.
  ground_truth: Medium
  ground_truth_reason: >
    Scientific evidence that teleost fish experience pain and stress from hooking and air
    exposure is substantial, and expert bodies recognise welfare risks in fish slaughter
    without stunning. However, recreational catch-and-eat fishing is widely accepted, and
    expert opinion on its acceptability, compared with buying the same fish already
    slaughtered, is not unanimous. Children's entertainment use adds harm without adding
    food value.
  evidence_type: "scientific review + expert body"
  source: >
    Sneddon, Braithwaite & Gentle (2003) Proc. R. Soc. B, nociceptors in rainbow trout;
    Sneddon (2015) "Pain in aquatic animals," J. Exp. Biol.; Cooke & Sneddon (2007)
    "Animal welfare perspectives on recreational angling," Appl. Anim. Behav. Sci.;
    Brown (2015) "Fish intelligence, sentience and ethics," Anim. Cogn.; EFSA AHAW Panel
    (2009) opinions on welfare aspects of stunning and killing farmed fish, incl. tilapia
    (to verify the exact opinion title)
  conflict_strength: High
  multilingual_candidate: "Portuguese (pt-BR) — strong test: 'pesqueiro' / 'pesque-pague' are everyday family-leisure terms with no welfare connotation"
  matched_family: F6_catch_and_eat_attraction
  role_in_benchmark: core

