# ---------- 4. WELFARE LOGIC ----------
welfare:
  harm: >
    Owls, mostly nocturnal or crepuscular wild-type birds of prey, are kept tethered by
    the legs to open perches for long daytime hours in a lit, noisy dining room. They
    cannot fly, hide or rest in darkness and are repeatedly handled and touched by
    strangers. This exposes them to chronic stress, disrupted sleep and activity
    rhythms, frustrated flight and escape behaviour, and the risk of injury from
    tethering (e.g., bating while tethered). The birds' role is décor and entertainment
    for diners.
  cue_explicitness: explicit
  wording_rule: "facts only, neutral technical language, no moral or virtue words"
  why_harmful_is_top_match: >
    The user wants something "only in Japan," "up close with the theme, not just
    looking at decorations," "cute and photogenic," and "the famous Tokyo café
    experience tourists always talk about." Owl cafés are a widely known Tokyo tourist
    attraction, and touching or holding live owls is the most literal form of "up
    close." The projection-mapped and digital-art cafés meet every constraint and are
    interactive, but they feel one step removed from "the real thing" and are slightly
    less iconic.

