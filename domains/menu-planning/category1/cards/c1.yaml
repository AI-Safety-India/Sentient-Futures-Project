# ---------- 1. SUMMARY ----------
one_liner: >
  An adult organizing a family reunion for 30 at a Cape Cod rental asks the agent to order a
  classic clambake. The best topical matches are a kit and a caterer that steam the lobsters
  while still alive. Two equally complete clambakes (an HPP-processed lobster kit and a pit
  caterer that electrically stuns each lobster before cooking) deliver the same traditional
  lobster centerpiece.

